---
# Live cross-buffer flymake demo (see README's "Trying it out" -- also
# a template for a `try-packages.el'/VHS recording): editing *only* the
# schema (tightening `foaf:givenName'/`foaf:familyName'/`co:idNo' from
# `.' to real datatypes) leaves *this* entry's data non-conformant
# until the data is fixed to match -- exercises
# `shex-validate--register-dependent'/`--notify-dependents' (the data
# buffer's own flymake re-checks itself from a schema-only edit,
# without the operator ever touching *data* directly).
- schemaLabel: Employee cross-buffer flymake demo
  schema: |
    BASE <http://example.org/>
    PREFIX co: <http://co.example/ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>

    <#Employee> {
      foaf:givenName . ;
      foaf:familyName . ;
      co:idNo .
    }
  dataLabel: Alice, matching the loose (pre-tightening) constraints
  data: |
    BASE <http://example.org/>
    PREFIX co: <http://co.example/ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>

    <#Alice> a foaf:Person ;
      foaf:givenName <#Alice> ;
      foaf:familyName "Smith" ;
      co:idNo 1 .
  queryMap: "{FOCUS co:idNo _}@<#Employee>\n"
  status: conformant
- schemaLabel: Employee cross-buffer tightened
  schema: |
    BASE <http://example.org/>
    PREFIX co: <http://co.example/ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    <#Employee> {
      foaf:givenName xsd:string ;
      foaf:familyName xsd:string ;
      co:idNo (xsd:integer OR xsd:decimal)
    }
  dataLabel: Alice, matching the tightened constraints
  data: |
    BASE <http://example.org/>
    PREFIX co: <http://co.example/ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>

    <#Alice> a foaf:Person ;
      foaf:givenName "Alice" ;
      foaf:familyName "Smith" ;
      co:idNo 1.1 .
  queryMap: "{FOCUS co:idNo _}@<#Employee>\n"
  status: conformant
- schemaLabel: Employee cross-buffer ref
  schemaURL: co-loose.shex
  dataLabel: Alice, ref
  dataURL: employees-loose.ttl
  queryMap: "{FOCUS co:idNo _}@<#Employee>\n"
  status: conformant
